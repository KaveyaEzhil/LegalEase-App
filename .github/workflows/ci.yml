name: LegalEase CI & Auto-Commit

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f web/requirements.txt ]; then pip install -r web/requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Python unit tests
        env:
          PYTHONPATH: web:backend
        run: |
          python -m unittest tests/test_index_unit.py

      - name: Auto-commit generated changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync CI changes [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: '*'
